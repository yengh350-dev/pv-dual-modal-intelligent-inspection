services:
  api:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/sentinel.db
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      ALLOWED_ORIGINS: http://localhost:8080
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
    volumes:
      - sentinel-data:/data
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sentinel-data:
